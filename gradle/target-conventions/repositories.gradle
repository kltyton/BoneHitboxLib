repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'GeckoLib'; url = uri('https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/') } }
        filter {
            includeGroupAndSubgroups('com.geckolib')
            includeGroupAndSubgroups('software.bernie.geckolib')
            includeGroup('com.eliotlash.mclib')
        }
    }
    exclusiveContent {
        forRepository { maven { name = 'Fuzs'; url = uri('https://raw.githubusercontent.com/Fuzss/modresources/main/maven/') } }
        filter { includeGroupAndSubgroups('fuzs.forgeconfigapiport') }
    }
    maven { url = uri('https://maven.fabricmc.net'); content { includeGroupAndSubgroups('net.fabricmc') } }
    maven { url = uri('https://maven.neoforged.net/releases'); content { includeGroupAndSubgroups('net.neoforged') } }
    maven { url = uri('https://maven.minecraftforge.net'); content { includeGroupAndSubgroups('net.minecraftforge'); includeGroup('org.spongepowered') } }
}
